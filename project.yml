name: DSClient

options:
  bundleIdPrefix: link.aitimes
  deploymentTarget:
    iOS: "27.2"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "27.2"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages: {}

targets:
  DSClient:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Resources
      - path: Sources/Resources/web
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Support/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: link.aitimes.dsclient
        PRODUCT_NAME: DSClient
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_MACCATALYST: "NO"

schemes:
  DSClient:
    build:
      targets:
        DSClient: all
    run:
      config: Debug
    archive:
      config: Release
