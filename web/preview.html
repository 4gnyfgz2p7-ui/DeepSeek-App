判别式为 $\\Delta = b^2 - 4ac$，当 $\\Delta \\geq 0$ 时：

$$

| 情形 | 判别式 | 根 |
| --- | --- | --- |
| 两个实根 | $\\Delta > 0$ | 相异 |

\`\`\`swift
func roots(a: Double, b: Double, c: Double) -> (Double, Double)? {
    let delta = b * b - 4 * a * c
    guard delta >= 0 else { return nil }
    let s = delta.squareRoot()
    return ((-b + s) / (2 * a), (-b - s) / (2 * a))
}
\`\`\`
